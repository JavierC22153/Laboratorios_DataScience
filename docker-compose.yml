services:

  db:
    image: postgres:15
    container_name: metabase_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mb_user
      POSTGRES_PASSWORD: mb_pass
      POSTGRES_DB: mb_db
    volumes:
      - pgdata_metabase:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_app
    restart: unless-stopped
    environment:
      MB_DB_TYPE: "postgres"
      MB_DB_DBNAME: "mb_db"
      MB_DB_PORT: 5432
      MB_DB_USER: "mb_user"
      MB_DB_PASS: "mb_pass"
      MB_DB_HOST: "db"           
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  pgdata_metabase:
